<!doctype html>
<!-- Source for assets/share-card.jpg (1200x630 Open Graph image). Regenerate with
     _tools/build-share-card.sh after editing. Mirrors the homepage hero. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;background:#cdddee url('../assets/banner-home.webp') center right/cover no-repeat;font-family:Raleway,sans-serif}
  .card::after{content:'';position:absolute;inset:0;background:linear-gradient(95deg,rgba(248,251,254,.96) 0%,rgba(248,251,254,.9) 34%,rgba(248,251,254,.6) 58%,rgba(248,251,254,.12) 82%,rgba(248,251,254,0) 100%)}
  .inner{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 80px;box-sizing:border-box;max-width:820px}
  .name{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#003366;margin:0 0 26px}
  h1{font-size:54px;line-height:1.1;font-weight:800;letter-spacing:-.015em;color:#13233a;margin:0 0 30px}
  hr{width:72px;height:5px;background:#003366;border:0;margin:0 0 28px}
  .title{font-size:23px;line-height:1.5;font-weight:600;color:#232323;margin:0}
  .url{position:absolute;right:56px;bottom:40px;z-index:2;font:700 20px Raleway,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
</style></head>
<body><div class="card"><div class="inner">
  <p class="name">Vern L. Glaser</p>
  <h1>How are AI and algorithms reshaping organizational routines and strategy?</h1>
  <hr>
  <p class="title">Professor of Entrepreneurship &amp; Family Enterprise<br>University of Alberta</p>
</div><div class="url">vernglaser.com</div></div></body></html>
